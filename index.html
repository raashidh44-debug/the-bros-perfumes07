<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>THE BROS</title>
  <style>
    /* Premium Black & Gold Theme */
    :root {
      --bg-color: #0b0b0b;
      --card-bg: #141414;
      --gold: #d4af37;
      --gold-hover: #f3cf65;
      --text-muted: #a0a0a0;
    }

    body {
      margin: 0;
      padding: 0;
      background-color: var(--bg-color);
      color: #ffffff;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }

    .container {
      background-color: var(--card-bg);
      border: 1px solid rgba(212, 175, 55, 0.2);
      border-radius: 16px;
      padding: 40px;
      width: 100%;
      max-width: 380px;
      text-align: center;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.8);
    }

    /* Logo Styling */
    .logo-container img {
      width: 160px;
      height: auto;
      margin-bottom: 20px;
    }

    /* Sign-In Section (Hidden by default) */
    .signin-section {
      display: none; /* Set to 'flex' or toggle via JS when needed */
      flex-direction: column;
      gap: 15px;
      margin-top: 20px;
    }

    .input-field {
      background: #1f1f1f;
      border: 1px solid #333;
      border-radius: 8px;
      padding: 12px 16px;
      color: #fff;
      outline: none;
      transition: border 0.3s;
    }

    .input-field:focus {
      border-color: var(--gold);
    }

    .btn-gold {
      background-color: var(--gold);
      color: #000;
      font-weight: bold;
      border: none;
      padding: 12px;
      border-radius: 8px;
      cursor: pointer;
      transition: background 0.3s;
    }

    .btn-gold:hover {
      background-color: var(--gold-hover);
    }

    /* Optional Toggle Button for Testing */
    .admin-toggle {
      margin-top: 25px;
      background: transparent;
      border: 1px dashed #444;
      color: var(--text-muted);
      padding: 6px 12px;
      font-size: 12px;
      border-radius: 4px;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <div class="container">
    <!-- Brand Logo -->
    <div class="logo-container">
      <img src="YOUR_LOGO_IMAGE_URL_HERE.png" alt="THE BROS Logo">
    </div>

    <!-- Sign-In Form (Controlled Option) -->
    <div id="authContainer" class="signin-section">
      <input type="email" placeholder="Email" class="input-field">
      <input type="password" placeholder="Password" class="input-field">
      <button class="btn-gold">SIGN IN</button>
    </div>

    <!-- Quick Toggle Button (Optional) -->
    <button class="admin-toggle" onclick="toggleSignIn()">Toggle Sign-In Form</button>
  </div>

  <script>
    // --- CONFIGURATION ---
    // Change this variable to true whenever you want sign-in options enabled
    let enableSignIn = false; 

    const authContainer = document.getElementById('authContainer');

    function updateLayout() {
      if (enableSignIn) {
        authContainer.style.display = 'flex';
      } else {
        authContainer.style.display = 'none';
      }
    }

    // Function to easily switch modes manually
    function toggleSignIn() {
      enableSignIn = !enableSignIn;
      updateLayout();
    }

    // Initialize layout on page load
    updateLayout();
  </script>

</body>
</html>
